{% extends 'home/base.html' %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4 text-center">Assignments List</h1>

    <div class="text-end mb-3">
        <a href="{% url 'adminpanel:assignment_create' %}" class="btn btn-primary">Add New Assignment</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Assigned Date</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for assignment in assignments %}
                    <tr>
                        <td>{{ assignment.title }}</td>
                        <td>{{ assignment.assigned_date }}</td>
                        <td>{{ assignment.due_date }}</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a href="{% url 'adminpanel:assignment_detail' assignment.id %}" class="btn btn-sm btn-info">View</a>
                                <a href="{% url 'adminpanel:assignment_update' assignment.id %}" class="btn btn-sm btn-warning">Edit</a>
                                <a href="{% url 'adminpanel:assignment_delete' assignment.id %}" class="btn btn-sm btn-danger">Delete</a>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
