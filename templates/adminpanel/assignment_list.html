{% extends 'home/base.html' %}
{% block content %}
<h1>Assignments List</h1>
<a href="{% url 'adminpanel:assignment_create' %}" class="btn btn-primary">Add New Assignment</a>
<table class="table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Assigned Date</th>
            <th>Due Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for assignment in assignments %}
            <tr>
                <td>{{ assignment.title }}</td>
                <td>{{ assignment.assigned_date }}</td>
                <td>{{ assignment.due_date }}</td>
                <td>
                    <a href="{% url 'adminpanel:assignment_detail' assignment.id %}" class="btn btn-info">View</a>
                    <a href="{% url 'adminpanel:assignment_update' assignment.id %}" class="btn btn-warning">Edit</a>
                    <a href="{% url 'adminpanel:assignment_delete' assignment.id %}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
